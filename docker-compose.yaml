services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_backoffice_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - 3000:3000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backoffice_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-school_backoffice}
    ports:
      - 8080:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-school_backoffice}
      HQ_BRANCH_CODE: ${HQ_BRANCH_CODE:-HQ}
      HQ_BRANCH_NAME: ${HQ_BRANCH_NAME:-Headquarters}
      HQ_STAFF_USERNAME: ${HQ_STAFF_USERNAME:-hq.staff}
      HQ_STAFF_DISPLAY_NAME: ${HQ_STAFF_DISPLAY_NAME:-HQ Staff}
      HQ_STAFF_PASSWORD: ${HQ_STAFF_PASSWORD:-ChangeMe123!}
    command:
      ["sh", "-c", "npm run prisma:migrate:deploy && npm run prisma:seed"]
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    container_name: school_backoffice_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
